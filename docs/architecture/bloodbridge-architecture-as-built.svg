<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" style="color:#1a1315"
        viewBox="0 0 1040 700"
        role="img"
        aria-label="Deployment diagram: one HP ENVY laptop running a browser, the Next.js server on port 3000 with forty API endpoints grouped by role, PostgreSQL on port 5432 and a llama.cpp model server on port 8080, with outbound connections to Gmail SMTP, Google Identity and an SMS gateway."
      >
  <style>
    text { font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif; fill: #1a1315; }
    text.m { font-family: "JetBrains Mono", Consolas, ui-monospace, monospace; }
    text.tier { font-size: 11px; letter-spacing: 0.14em; opacity: 0.6; }
    text.a { fill: #a11733; }
    .as { stroke: #a11733; }
    marker#arrow-accent path, marker#t-arrow-accent path, marker#s-arrow-accent path { fill: #a11733; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff" />
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
          <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" />
          </marker>
        </defs>

        <!-- THE PHYSICAL DEVICE -->
        <rect x="32" y="56" width="668" height="612" rx="10" fill="none" stroke="currentColor" stroke-width="2.5" />
        <text x="52" y="86" font-size="15" font-weight="600">HP ENVY x360 15-eu0xxx — the only machine</text>
        <text x="52" y="107" class="m" font-size="11" opacity="0.75">Windows 11 Home 26100 · Ryzen 5 5500U 6C/12T · 7.3 GB RAM</text>
        <line x1="52" y1="120" x2="680" y2="120" stroke="currentColor" stroke-width="1" opacity="0.18" />

        <!-- browser -->
        <rect x="56" y="146" width="186" height="104" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" />
        <text x="74" y="174" font-size="14" font-weight="600">Web browser</text>
        <text x="74" y="195" class="m" font-size="10.5" opacity="0.75">Chrome or Edge</text>
        <text x="74" y="213" class="m" font-size="10.5" opacity="0.75">http://localhost:3000</text>
        <text x="74" y="235" class="m" font-size="10.5" opacity="0.75">holds the session cookie</text>

        <line x1="242" y1="198" x2="296" y2="198" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="248" y="190" class="m" font-size="10">loopback</text>

        <!-- Next.js server + API surface -->
        <rect x="296" y="146" width="380" height="372" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" />
        <text x="314" y="174" font-size="14" font-weight="600">Next.js 16 server</text>
        <text x="314" y="194" class="m" font-size="10.5" opacity="0.75">Node.js 24 · listens 127.0.0.1:3000</text>
        <text x="314" y="216" class="m" font-size="10" letter-spacing="0.08em" opacity="0.6">HTTP API — 40 ROUTE HANDLERS</text>
        <line x1="314" y1="226" x2="658" y2="226" stroke="currentColor" stroke-width="1" opacity="0.18" />

        <text x="314" y="248" class="m" font-size="10.5">/api/login · /register · /logout · /auth/*</text>
        <text x="620" y="248" class="m" font-size="10" text-anchor="end" opacity="0.6">10</text>

        <text x="314" y="274" class="m" font-size="10.5">/api/eligibility · /appointments · /donations</text>
        <text x="620" y="274" class="m" font-size="10" text-anchor="end" opacity="0.6">7</text>

        <text x="314" y="300" class="m" font-size="10.5">/api/ai-chat · /conversations · /notifications</text>
        <text x="620" y="300" class="m" font-size="10" text-anchor="end" opacity="0.6">5</text>

        <text x="314" y="326" class="m" font-size="10.5">/api/medical-staff/*</text>
        <text x="620" y="326" class="m" font-size="10" text-anchor="end" opacity="0.6">3</text>

        <text x="314" y="352" class="m" font-size="10.5">/api/lab-tech/*</text>
        <text x="620" y="352" class="m" font-size="10" text-anchor="end" opacity="0.6">4</text>

        <text x="314" y="378" class="m" font-size="10.5">/api/institute-admin/*</text>
        <text x="620" y="378" class="m" font-size="10" text-anchor="end" opacity="0.6">5</text>

        <text x="314" y="404" class="m" font-size="10.5">/api/system-admin/*</text>
        <text x="620" y="404" class="m" font-size="10" text-anchor="end" opacity="0.6">6</text>

        <line x1="314" y1="424" x2="658" y2="424" stroke="currentColor" stroke-width="1" opacity="0.18" />
        <text x="314" y="446" class="m" font-size="10.5" opacity="0.8">every call carries the session cookie;</text>
        <text x="314" y="463" class="m" font-size="10.5" opacity="0.8">the role guard runs before the handler</text>
        <text x="314" y="491" class="m" font-size="10.5" opacity="0.8">GET · POST · PATCH · PUT · DELETE · JSON</text>

        <!-- datastores -->
        <line x1="400" y1="518" x2="400" y2="566" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="410" y="547" class="m" font-size="10">SQL · TCP</text>

        <line x1="576" y1="518" x2="576" y2="566" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="586" y="547" class="m" font-size="10">HTTP · /v1</text>

        <rect x="296" y="570" width="180" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" />
        <text x="314" y="596" font-size="13.5" font-weight="600">PostgreSQL</text>
        <text x="314" y="615" class="m" font-size="10.5" opacity="0.75">127.0.0.1:5432</text>
        <text x="314" y="633" class="m" font-size="10.5" opacity="0.75">16 tables</text>

        <rect x="496" y="570" width="180" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" />
        <text x="514" y="596" font-size="13.5" font-weight="600">llama-server</text>
        <text x="514" y="615" class="m" font-size="10.5" opacity="0.75">127.0.0.1:8080 · 6 threads</text>
        <text x="514" y="633" class="m" font-size="10.5" opacity="0.75">Qwen2.5-1.5B · 1.1 GB</text>

        <!-- EGRESS -->
        <line x1="676" y1="300" x2="740" y2="300" stroke-width="1.5" class="as" />
        <line x1="740" y1="188" x2="740" y2="580" stroke-width="1.5" class="as" />
        <text x="684" y="292" class="m a" font-size="10">leaves the</text>
        <text x="684" y="305" class="m a" font-size="10">machine</text>

        <line x1="740" y1="188" x2="784" y2="188" stroke-width="1.5" class="as" marker-end="url(#arrow-accent)" />
        <rect x="788" y="146" width="220" height="84" rx="6" fill="none" stroke-width="1.5" class="as" />
        <text x="806" y="172" font-size="13.5" font-weight="600">Gmail SMTP</text>
        <text x="806" y="191" class="m" font-size="10.5" opacity="0.75">smtp.gmail.com:587</text>
        <text x="806" y="209" class="m" font-size="10.5" opacity="0.75">STARTTLS · nodemailer</text>

        <line x1="740" y1="384" x2="784" y2="384" stroke-width="1.5" class="as" marker-end="url(#arrow-accent)" />
        <rect x="788" y="330" width="220" height="108" rx="6" fill="none" stroke-width="1.5" stroke-dasharray="5 4" class="as" />
        <text x="806" y="356" font-size="13.5" font-weight="600">Google Identity</text>
        <text x="806" y="375" class="m" font-size="10.5" opacity="0.75">accounts.google.com</text>
        <text x="806" y="393" class="m" font-size="10.5" opacity="0.75">oauth2.googleapis.com</text>
        <text x="806" y="411" class="m" font-size="10.5" opacity="0.75">/token · /oauth2/v3/certs</text>

        <line x1="740" y1="580" x2="784" y2="580" stroke-width="1.5" class="as" marker-end="url(#arrow-accent)" />
        <rect x="788" y="538" width="220" height="84" rx="6" fill="none" stroke-width="1.5" stroke-dasharray="5 4" class="as" />
        <text x="806" y="564" font-size="13.5" font-weight="600">SMS gateway</text>
        <text x="806" y="583" class="m" font-size="10.5" opacity="0.75">api.africastalking.com</text>
        <text x="806" y="601" class="m" font-size="10.5" opacity="0.75">or api.twilio.com</text>

        <!-- browser leaves for consent -->
        <path d="M149 146 V104 H898 V330" fill="none" stroke-width="1.5" stroke-dasharray="5 4" class="as" marker-end="url(#arrow-accent)" />
        <text x="420" y="96" class="m a" font-size="10.5">OAuth consent — the browser itself goes to Google, then returns to /api/auth/google/callback</text>
      </svg>